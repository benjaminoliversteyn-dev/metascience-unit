<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Marian</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --fire: #ff6b35;
    --grass: #4caf50;
    --normal: #a8a878;
    --psychic: #f85888;
    --fairy: #ee99ac;
    --gold: #ffd700;
    --card-w: 280px;
    --card-h: 400px;
  }

  body {
    font-family: 'Nunito', sans-serif;
    background: #1a0a2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse at 20% 50%, #2d0a4e 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, #0a1a4e 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, #0a2e1a 0%, transparent 50%);
    z-index: 0;
  }

  .stars { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle var(--d) ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    from { opacity: 0.1; transform: scale(1); }
    to   { opacity: 1;   transform: scale(1.3); }
  }

  /* ── PACK SCREEN ── */
  #pack-screen {
    position: relative; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; gap: 20px;
    text-align: center; padding: 20px;
  }

  .birthday-title {
    font-family: 'Bangers', cursive;
    font-size: 2.6rem;
    color: var(--gold);
    text-shadow: 3px 3px 0 #a00, 0 0 30px rgba(255,215,0,0.6);
    letter-spacing: 3px;
    animation: pulse-glow 2s ease-in-out infinite alternate;
  }
  .birthday-sub {
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    color: rgba(255,255,255,0.85);
    font-weight: 700;
    line-height: 1.6;
  }
  @keyframes pulse-glow {
    from { text-shadow: 3px 3px 0 #a00, 0 0 20px rgba(255,215,0,0.4); }
    to   { text-shadow: 3px 3px 0 #a00, 0 0 50px rgba(255,215,0,0.9), 0 0 80px rgba(255,100,0,0.4); }
  }

  .pack {
    width: 180px; height: 310px;
    border-radius: 18px;
    background: linear-gradient(145deg, #c8102e 0%, #e63946 30%, #ffd700 50%, #e63946 70%, #c8102e 100%);
    border: 4px solid var(--gold);
    box-shadow: 0 0 40px rgba(255,215,0,0.5), inset 0 0 20px rgba(0,0,0,0.2);
    cursor: pointer;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    position: relative; overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .pack::before {
    content: '';
    position: absolute; top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: conic-gradient(transparent, rgba(255,255,255,0.15), transparent 30%);
    animation: spin 3s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pack:hover { transform: translateY(-8px) rotate(1deg); box-shadow: 0 20px 60px rgba(255,215,0,0.7); }

  .pack-ball {
    width: 70px; height: 70px; border-radius: 50%;
    background: linear-gradient(180deg, white 50%, #e63946 50%);
    border: 4px solid #333;
    box-shadow: 0 0 20px rgba(255,255,255,0.4);
    position: relative; z-index: 1;
  }
  .pack-ball::after {
    content: ''; position: absolute;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 22px; height: 22px; border-radius: 50%;
    background: white; border: 4px solid #333;
  }
  .pack-ball::before {
    content: ''; position: absolute;
    top: 50%; left: 0; right: 0; height: 4px;
    background: #333; transform: translateY(-50%); z-index: -1;
  }

  .pack-label {
    font-family: 'Bangers', cursive;
    font-size: 1.1rem; color: white;
    text-align: center; letter-spacing: 1px;
    position: relative; z-index: 1;
    text-shadow: 1px 1px 0 #a00;
  }

  .open-btn {
    font-family: 'Bangers', cursive;
    font-size: 1.5rem; letter-spacing: 2px;
    color: #1a0a2e;
    background: linear-gradient(135deg, var(--gold), #ffb300);
    border: none; border-radius: 50px;
    padding: 14px 40px; cursor: pointer;
    box-shadow: 0 6px 0 #b8860b, 0 0 30px rgba(255,215,0,0.4);
    transition: all 0.15s;
  }
  .open-btn:hover { transform: translateY(-3px); box-shadow: 0 9px 0 #b8860b; }
  .open-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #b8860b; }

  .hidden { display: none !important; }

  /* ── OPENING ── */
  #opening-screen {
    position: relative; z-index: 10;
    display: flex; align-items: center; justify-content: center;
  }
  .pack-rip {
    width: 180px; height: 310px; border-radius: 18px;
    background: linear-gradient(145deg, #c8102e, #ffd700, #c8102e);
    border: 4px solid var(--gold);
    animation: rip 0.6s ease-in forwards;
    transform-origin: center top;
  }
  @keyframes rip {
    0%   { transform: scale(1) rotate(0deg); opacity: 1; }
    30%  { transform: scale(1.1) rotate(-5deg); }
    60%  { transform: scale(0.9) rotate(10deg); }
    100% { transform: scale(0) rotate(20deg) translateY(100px); opacity: 0; }
  }

  /* ── CARD SCREEN ── */
  #card-screen {
    position: relative; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; gap: 20px;
    width: 100%; max-width: 420px; padding: 20px;
  }

  .card-counter {
    font-family: 'Bangers', cursive;
    font-size: 1.3rem; color: rgba(255,215,0,0.8); letter-spacing: 2px;
  }

  .card-stack {
    position: relative;
    width: var(--card-w); height: var(--card-h);
  }

  .card-ghost {
    position: absolute;
    width: var(--card-w); height: var(--card-h);
    border-radius: 16px;
    background: linear-gradient(135deg, #2a1a5e, #1a0a3e);
    border: 2px solid rgba(255,215,0,0.3);
  }
  .card-ghost:nth-child(1) { transform: rotate(3deg) translateY(6px); }
  .card-ghost:nth-child(2) { transform: rotate(-2deg) translateY(4px); }
  .card-ghost:nth-child(3) { transform: rotate(1deg) translateY(2px); }

  .pokemon-card {
    position: absolute;
    width: var(--card-w); height: var(--card-h);
    border-radius: 16px;
    border: 3px solid var(--gold);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 20px rgba(255,215,0,0.2);
    display: flex; flex-direction: column;
    overflow: hidden; cursor: grab; user-select: none;
    animation: card-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    transform: translateY(40px); opacity: 0;
  }
  @keyframes card-in { to { transform: translateY(0); opacity: 1; } }
  .pokemon-card:active { cursor: grabbing; }
  .pokemon-card.dragging { transition: none; }
  .pokemon-card.swiped-left  { animation: swipe-left  0.4s ease-in forwards; }
  .pokemon-card.swiped-right { animation: swipe-right 0.4s ease-in forwards; }
  @keyframes swipe-left  { to { transform: translateX(-150%) rotate(-15deg); opacity: 0; } }
  @keyframes swipe-right { to { transform: translateX(150%)  rotate(15deg);  opacity: 0; } }

  /* Card internals */
  .card-header {
    display: flex; align-items: center;
    justify-content: space-between;
    padding: 10px 12px 6px; color: white;
  }
  .card-name {
    font-family: 'Bangers', cursive;
    font-size: 1.05rem; letter-spacing: 1px;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.5);
    line-height: 1.1; max-width: 170px;
  }
  .card-hp {
    font-family: 'Bangers', cursive;
    font-size: 1rem; color: rgba(255,255,255,0.9); white-space: nowrap;
  }
  .card-hp span { font-size: 1.4rem; }
  .card-type-badge {
    display: inline-block; font-size: 0.6rem;
    font-weight: 900; text-transform: uppercase;
    letter-spacing: 1px; padding: 2px 6px;
    border-radius: 20px; background: rgba(0,0,0,0.3);
    color: white; margin-top: 2px;
  }

  .card-image {
    width: 100%; height: 155px;
    border-top: 2px solid rgba(255,255,255,0.3);
    border-bottom: 2px solid rgba(255,255,255,0.3);
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.2);
  }
  .card-image img.sprite {
    /* For PNG sprites with transparency */
    max-width: 100%; max-height: 100%;
    object-fit: contain; padding: 8px;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
  }
  .card-image img.photo {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .card-image-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.3));
    pointer-events: none;
  }

  .card-body {
    flex: 1; padding: 8px 12px;
    display: flex; flex-direction: column; gap: 6px; overflow: hidden;
  }
  .card-move {
    background: rgba(0,0,0,0.2); border-radius: 8px;
    padding: 6px 8px; border-left: 3px solid rgba(255,255,255,0.4);
  }
  .move-header { display: flex; justify-content: space-between; align-items: center; }
  .move-name { font-weight: 900; font-size: 0.7rem; color: white; text-transform: uppercase; letter-spacing: 0.5px; }
  .move-damage { font-family: 'Bangers', cursive; font-size: 1rem; color: var(--gold); }
  .move-desc { font-size: 0.58rem; color: rgba(255,255,255,0.8); line-height: 1.3; margin-top: 2px; }

  .card-flavor { font-size: 0.58rem; color: rgba(255,255,255,0.6); font-style: italic; text-align: center; padding: 0 4px; line-height: 1.3; }

  .card-footer {
    padding: 6px 12px;
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid rgba(255,255,255,0.2);
  }
  .card-rarity { font-size: 0.65rem; color: rgba(255,255,255,0.7); font-weight: 700; }
  .rarity-stars { color: var(--gold); letter-spacing: -1px; }

  .trainer-banner {
    background: rgba(0,0,0,0.5); text-align: center; padding: 4px;
    font-family: 'Bangers', cursive; font-size: 0.7rem;
    letter-spacing: 3px; color: var(--gold);
    border-bottom: 1px solid rgba(255,215,0,0.3);
  }
  .trainer-effect {
    font-size: 0.62rem; color: rgba(255,255,255,0.85);
    line-height: 1.4; padding: 8px;
    background: rgba(0,0,0,0.2); border-radius: 8px;
    border: 1px solid rgba(255,215,0,0.2);
  }

  .card-nav { display: flex; align-items: center; gap: 16px; }
  .nav-btn {
    font-family: 'Bangers', cursive; font-size: 1rem; letter-spacing: 1px;
    color: #1a0a2e;
    background: linear-gradient(135deg, var(--gold), #ffb300);
    border: none; border-radius: 30px; padding: 10px 24px;
    cursor: pointer; box-shadow: 0 4px 0 #b8860b; transition: all 0.15s;
  }
  .nav-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 0 #b8860b; }
  .nav-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 #b8860b; }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .swipe-hint { font-size: 0.75rem; color: rgba(255,215,0,0.5); letter-spacing: 1px; }

  /* Done screen */
  #done-screen {
    position: relative; z-index: 10; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 20px;
  }
  .done-title {
    font-family: 'Bangers', cursive; font-size: 3rem; color: var(--gold);
    text-shadow: 3px 3px 0 #a00; animation: pulse-glow 2s infinite alternate;
  }
  .restart-btn {
    font-family: 'Bangers', cursive; font-size: 1.4rem; letter-spacing: 2px;
    color: #1a0a2e; background: linear-gradient(135deg, var(--gold), #ffb300);
    border: none; border-radius: 50px; padding: 14px 36px;
    cursor: pointer; box-shadow: 0 6px 0 #b8860b; transition: all 0.15s;
  }
  .restart-btn:hover { transform: translateY(-3px); box-shadow: 0 9px 0 #b8860b; }

  /* Type backgrounds */
  .type-fire    { background: linear-gradient(160deg, #c0392b 0%, #e67e22 50%, #8b1a1a 100%); }
  .type-grass   { background: linear-gradient(160deg, #1e5631 0%, #2ecc71 50%, #145a32 100%); }
  .type-normal  { background: linear-gradient(160deg, #5d6d7e 0%, #85929e 50%, #2e4053 100%); }
  .type-psychic { background: linear-gradient(160deg, #6c0867 0%, #c0392b 50%, #922b21 100%); }
  .type-fairy   { background: linear-gradient(160deg, #7b2d8b 0%, #c471ed 50%, #4a1460 100%); }
  .type-trainer { background: linear-gradient(160deg, #1a3a5c 0%, #2980b9 50%, #0d2137 100%); }
  .type-electric { background: linear-gradient(160deg, #7d6608 0%, #f4d03f 50%, #5d4e08 100%); }
  .type-dark { background: linear-gradient(160deg, #1a1a2e 0%, #4a3060 50%, #0d0d1a 100%); }
  .type-water { background: linear-gradient(160deg, #0a2a5e 0%, #1a6eb5 50%, #051a3e 100%); }
  .type-charizard { background: #1a1008; }

  .holo::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.08) 40%, rgba(255,215,0,0.12) 50%, rgba(255,255,255,0.08) 60%, rgba(255,255,255,0) 100%);
    pointer-events: none; border-radius: 14px;
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<!-- PACK SCREEN -->
<div id="pack-screen">
  <div class="birthday-title">Happy Birthday Marian</div>
  <div class="birthday-sub">Some Pokémon cards for you,<br>love Ben</div>
  <div class="pack">
    <div class="pack-ball"></div>
    <div class="pack-label">14 CARDS INSIDE</div>
  </div>
  <button class="open-btn" onclick="startOpen()">🎴 OPEN PACK</button>
</div>

<!-- OPENING ANIMATION SCREEN -->
<div id="opening-screen" class="hidden">
  <div class="pack-rip"></div>
</div>

<!-- CARD VIEWER SCREEN -->
<div id="card-screen" class="hidden">
  <div class="card-counter" id="card-counter">Card 1 of 6</div>
  <div class="card-stack" id="card-stack">
    <div class="card-ghost"></div>
    <div class="card-ghost"></div>
    <div class="card-ghost"></div>
  </div>
  <div class="swipe-hint">← swipe or use buttons →</div>
  <div class="card-nav">
    <button class="nav-btn" id="prev-btn" onclick="prevCard()" disabled>◀ PREV</button>
    <button class="nav-btn" id="next-btn" onclick="nextCard()">NEXT ▶</button>
  </div>
</div>

<!-- DONE SCREEN -->
<div id="done-screen" class="hidden">
  <div class="done-title">🎉 Happy Birthday! 🎉</div>
  <p style="color:rgba(255,255,255,0.7);font-size:0.9rem;">Love Ben x</p>
  <button class="restart-btn" onclick="restart()">🔄 Open Again</button>
</div>

  starsEl.appendChild(s);

let current = 0;

function show(id) {
  ['pack-screen','opening-screen','card-screen','done-screen'].forEach(s =>
    document.getElementById(s).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function startOpen() {
  show('opening-screen');
  setTimeout(() => { current = 0; show('card-screen'); renderCard(current); updateNav(); }, 800);
}
function restart() { show('pack-screen'); }

function renderCard(index) {
  const c = cards[index];
  const stack = document.getElementById('card-stack');
  const old = stack.querySelector('.pokemon-card');
  if (old) old.remove();

  const card = document.createElement('div');
  card.className = `pokemon-card type-${c.type} ${c.holo ? 'holo' : ''}`;

  // Image HTML
  const imgSrc = c.imageData || c.imageUrl;
  const pos = c.imagePosition || 'center center';
  const fit = c.objectFit || 'cover';
  let imageHTML = '';
  if (c.imageClass === 'sprite') {
    imageHTML = `<img class="sprite" src="${imgSrc}" alt="${c.name}">`;
  } else {
    imageHTML = `<img class="photo" src="${imgSrc}" alt="${c.name}" style="object-position: ${pos}; object-fit: ${fit};">
                 <div class="card-image-overlay"></div>`;
  }

  if (c.isFullArt) {
    card.innerHTML = `
      <div class="card-image" style="height:100%;border:none;">${imageHTML}</div>`;
  } else if (c.isTrainer) {
    card.innerHTML = `
      <div class="trainer-banner">— TRAINER —</div>
      <div class="card-header">
        <div>
          <div class="card-name">${c.name}</div>
          <div class="card-type-badge">${c.typeLabel}</div>
        </div>
      </div>
      <div class="card-image" style="${!c.trainerEffect ? 'height:260px;' : ''}">${imageHTML}</div>
      <div class="card-body">
        ${c.trainerEffect ? `<div class="trainer-effect">${c.trainerEffect}</div>` : ''}
        ${c.flavor ? `<div class="card-flavor" style="margin-top:4px">${c.flavor}</div>` : ''}
      </div>
      <div class="card-footer">
        <span class="card-rarity">${c.rarity}</span>
        <span class="rarity-stars">${c.rarityStars}</span>
      </div>`;
  } else {
    const movesHTML = c.moves.map(m => `
      <div class="card-move">
        <div class="move-header">
          <span class="move-name">${m.name}</span>
          <span class="move-damage">${m.damage}</span>
        </div>
        ${m.desc ? `<div class="move-desc">${m.desc}</div>` : ''}
      </div>`).join('');
    card.innerHTML = `
      <div class="card-header">
        <div>
          <div class="card-name">${c.name}</div>
          <div class="card-type-badge">${c.typeLabel}</div>
        </div>
        ${c.hp ? `<div class="card-hp"><span>${c.hp}</span> HP</div>` : ''}
      </div>
      <div class="card-image">${imageHTML}</div>
      <div class="card-body">
        ${movesHTML}
        ${c.flavor ? `<div class="card-flavor">${c.flavor}</div>` : ''}
      </div>
      <div class="card-footer">
        <span class="card-rarity">${c.rarity}</span>
        <span class="rarity-stars">${c.rarityStars}</span>
      </div>`;
  }

  stack.appendChild(card);
  document.getElementById('card-counter').textContent = `Card ${index + 1} of ${cards.length}`;
  setupSwipe(card);
}

function updateNav() {
  document.getElementById('prev-btn').disabled = current === 0;
  const nxt = document.getElementById('next-btn');
  nxt.disabled = false;
  nxt.textContent = current === cards.length - 1 ? 'FINISH ✓' : 'NEXT ▶';
}

function nextCard() {
  if (current >= cards.length - 1) { show('done-screen'); return; }
  const card = document.querySelector('.pokemon-card');
  card.classList.add('swiped-left');
  setTimeout(() => { current++; renderCard(current); updateNav(); }, 380);
}
function prevCard() {
  if (current <= 0) return;
  const card = document.querySelector('.pokemon-card');
  card.classList.add('swiped-right');
  setTimeout(() => { current--; renderCard(current); updateNav(); }, 380);
}

function setupSwipe(el) {
  let startX = 0, startY = 0, isDragging = false, currentX = 0;
  function onStart(x, y) { startX = x; startY = y; isDragging = true; el.classList.add('dragging'); }
  function onMove(x, y) {
    if (!isDragging) return;
    currentX = x - startX;
    const dy = y - startY;
    if (Math.abs(currentX) < Math.abs(dy) && Math.abs(dy) > 10) { isDragging = false; return; }
    el.style.transform = `translateX(${currentX}px) rotate(${currentX * 0.05}deg)`;
  }
  function onEnd() {
    if (!isDragging) return;
    isDragging = false; el.classList.remove('dragging');
    if (currentX < -60) nextCard();
    else if (currentX > 60) prevCard();
    else el.style.transform = '';
    currentX = 0;
  }
  el.addEventListener('mousedown', e => onStart(e.clientX, e.clientY));
  window.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', onEnd);
  el.addEventListener('touchstart', e => onStart(e.touches[0].clientX, e.touches[0].clientY), {passive:true});
  el.addEventListener('touchmove',  e => onMove(e.touches[0].clientX, e.touches[0].clientY),  {passive:true});
  el.addEventListener('touchend', onEnd);
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') nextCard();
  if (e.key === 'ArrowLeft')  prevCard();
});
